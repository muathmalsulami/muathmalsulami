<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img">
  <title>A folded personal signature connects an interface, model integration and observability signal.</title>
  <style>.paper{fill:#f9eee5}.s-paper{stroke:#f9eee5}.stop-paper{stop-color:#f9eee5}.ink{fill:#291d37}.s-ink{stroke:#291d37}.stop-ink{stop-color:#291d37}.muted{fill:#623a66}.s-muted{stroke:#623a66}.stop-muted{stop-color:#623a66}.tone{fill:#e7c8cd}.s-tone{stroke:#e7c8cd}.stop-tone{stop-color:#e7c8cd}.amber{fill:#e9a256}.s-amber{stroke:#e9a256}.stop-amber{stop-color:#e9a256}.coral{fill:#bd382d}.s-coral{stroke:#bd382d}.stop-coral{stop-color:#bd382d}.iris{fill:#40398e}.s-iris{stroke:#40398e}.stop-iris{stop-color:#40398e}.rule{fill:#a080a0}.s-rule{stroke:#a080a0}.stop-rule{stop-color:#a080a0}.surface{fill:#fff9ef}.s-surface{stroke:#fff9ef}.stop-surface{stop-color:#fff9ef}.rose{fill:#bc7e99}.s-rose{stroke:#bc7e99}.stop-rose{stop-color:#bc7e99}@media(prefers-color-scheme:dark){.paper{fill:#23192f}.s-paper{stroke:#23192f}.stop-paper{stop-color:#23192f}.ink{fill:#fff0e5}.s-ink{stroke:#fff0e5}.stop-ink{stop-color:#fff0e5}.muted{fill:#e8c4dd}.s-muted{stroke:#e8c4dd}.stop-muted{stop-color:#e8c4dd}.tone{fill:#503451}.s-tone{stroke:#503451}.stop-tone{stop-color:#503451}.amber{fill:#ffd087}.s-amber{stroke:#ffd087}.stop-amber{stop-color:#ffd087}.coral{fill:#f77661}.s-coral{stroke:#f77661}.stop-coral{stop-color:#f77661}.iris{fill:#a99bf9}.s-iris{stroke:#a99bf9}.stop-iris{stop-color:#a99bf9}.rule{fill:#775779}.s-rule{stroke:#775779}.stop-rule{stop-color:#775779}.surface{fill:#3a2744}.s-surface{stroke:#3a2744}.stop-surface{stop-color:#3a2744}.rose{fill:#c890ac}.s-rose{stroke:#c890ac}.stop-rose{stop-color:#c890ac}}text{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,serif;letter-spacing:-.055em}.mono{font-family:Consolas,monospace;letter-spacing:.10em}@media(prefers-reduced-motion:no-preference){
  .upper,.lower,.terminal{transform-box:fill-box;transform-origin:center}
  .upper{animation:upper 1.75s cubic-bezier(.16,.72,.25,1) .20s both}
  .lower{animation:lower 1.65s cubic-bezier(.16,.72,.25,1) .92s both}
  .route{stroke-dasharray:100;animation:draw 1.7s cubic-bezier(.44,.08,.33,1) 2.05s both}
  .travel{stroke-dasharray:12 100;animation:travel 1.78s ease-in-out 3.65s both}
  .terminal{animation:lock .75s cubic-bezier(.18,.75,.3,1) 4.93s both}
  .draft{animation:draft 2.4s ease-out both}
  @keyframes upper{from{opacity:.23;transform:translate(-28px,-24px) rotate(-8deg)}to{opacity:1;transform:none}}
  @keyframes lower{from{opacity:.18;transform:translate(25px,44px) rotate(9deg)}to{opacity:1;transform:none}}
  @keyframes draw{from{stroke-dashoffset:100;opacity:.25}to{stroke-dashoffset:0;opacity:1}}
  @keyframes travel{0%{opacity:0;stroke-dashoffset:112}16%{opacity:1}80%{opacity:1}100%{opacity:0;stroke-dashoffset:0}}
  @keyframes lock{0%{opacity:.2;transform:scale(.65)}55%{opacity:1;transform:scale(1.22)}100%{opacity:1;transform:scale(1)}}
  @keyframes draft{from{opacity:.78}to{opacity:.43}}
}.travel{opacity:0}.draft{opacity:.43}</style>
  <defs>
    <linearGradient id="field" x2="1" y2="1"><stop class="stop-surface"/><stop offset="1" class="stop-tone"/></linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0"><stop class="stop-coral"/><stop offset="1" class="stop-amber"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="1"><stop class="stop-iris"/><stop offset="1" class="stop-rose"/></linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M 0 6 L 6 0" class="s-rule" stroke-width=".65" opacity=".6"/></pattern>
  </defs>
  <rect width="600" height="390" rx="22" fill="url(#field)"/>
    <clipPath id="frame"><rect width="600" height="390" rx="22"/></clipPath>
    <g clip-path="url(#frame)">
      <path class="paper" d="M 0 0 H 600 L 400 390 H 0 Z"/>
      <path fill="url(#hatch)" opacity=".45" d="M 460 0 H 600 V 390 H 360 Z"/>
    </g><g transform="translate(88 50) scale(1.08)"><g class="draft">
    <ellipse cx="199" cy="132" rx="204" ry="119" class="s-rule" fill="none"/>
    <ellipse cx="200" cy="132" rx="169" ry="85" class="s-rule" fill="none" stroke-dasharray="2 5"/>
    <path d="M -15 132 H 424 M 200 5 V 261 M 49 41 V 73 M 35 57 H 63 M 365 190 V 222 M 350 206 H 379" fill="none" class="s-rule" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </g><g class="upper">
  <path d="M 39 219 L 39 95 Q 39 54 84 41 L 154 19 L 214 82 L 286 19 L 351 39 Q 385 50 385 89 L 385 151 Q 385 171 362 179 L 314 196 L 281 159 L 319 146 Q 332 141 332 126 L 332 96 Q 332 82 318 77 L 296 70 L 212 145 L 141 69 L 106 81 Q 92 85 92 103 L 92 202 Z" class="ink" transform="translate(0 10)" opacity=".92"/>
  <path d="M 39 219 L 39 95 Q 39 54 84 41 L 154 19 L 214 82 L 286 19 L 351 39 Q 385 50 385 89 L 385 151 Q 385 171 362 179 L 314 196 L 281 159 L 319 146 Q 332 141 332 126 L 332 96 Q 332 82 318 77 L 296 70 L 212 145 L 141 69 L 106 81 Q 92 85 92 103 L 92 202 Z" fill="url(#heat)"/>
  <path d="M 39 95 Q 39 54 84 41 L 154 19 L 141 69 L 106 81 Q 92 85 92 103 Z M 214 82 L 286 19 L 296 70 L 212 145 Z M 351 39 Q 385 50 385 89 L 385 151 L 332 126 L 332 96 Q 332 82 318 77 Z" fill="url(#hatch)" opacity=".42"/>
  <path d="M 48 95 Q 48 61 85 50 L 152 29 L 212 93 L 285 31 L 345 48 Q 376 60 376 89" fill="none" class="s-surface" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 104 78 L 143 65 L 212 139 L 290 69 M 332 137 Q 331 150 320 154 L 291 165" fill="none" class="s-ink" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="lower">
    <path d="M 126 194 L 126 164 L 180 144 L 216 185 L 272 166 L 296 195 L 220 222 Q 208 227 197 215 L 173 189 L 173 208 Q 173 223 160 227 L 107 247 L 83 224 L 114 213 Q 126 208 126 194 Z" class="ink" transform="translate(0 9)" opacity=".93"/>
    <path d="M 126 194 L 126 164 L 180 144 L 216 185 L 272 166 L 296 195 L 220 222 Q 208 227 197 215 L 173 189 L 173 208 Q 173 223 160 227 L 107 247 L 83 224 L 114 213 Q 126 208 126 194 Z" fill="url(#fold)"/>
    <path d="M 132 168 L 178 152 L 214 193 L 271 174" fill="none" class="s-surface" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M 26 223 C 80 214 96 172 133 159 L 170 146 Q 184 142 196 155 L 212 174 Q 225 187 240 181 L 326 150 Q 351 141 351 118 V 96 Q 351 79 338 70 L 291 55" class="route s-surface" pathLength="100" fill="none" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M 26 223 C 80 214 96 172 133 159 L 170 146 Q 184 142 196 155 L 212 174 Q 225 187 240 181 L 326 150 Q 351 141 351 118 V 96 Q 351 79 338 70 L 291 55" class="travel s-amber" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/>
  <g class="terminal"><circle cx="291" cy="55" r="8" class="ink"/><circle cx="291" cy="55" r="3.6" class="amber"/></g></g><text x="34" y="344" font-size="42" font-weight="600" class="ink serif">From interface to signal</text><path d="M 38 364 H 561" fill="none" class="s-rule" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
