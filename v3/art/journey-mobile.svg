<svg xmlns="http://www.w3.org/2000/svg" width="600" height="126" viewBox="0 0 600 126" role="img">
  <title>NCM co-op in 2025, followed by university graduation and Pathy training in 2026.</title>
  <style>.paper{fill:#f9eee5}.s-paper{stroke:#f9eee5}.stop-paper{stop-color:#f9eee5}.ink{fill:#291d37}.s-ink{stroke:#291d37}.stop-ink{stop-color:#291d37}.muted{fill:#623a66}.s-muted{stroke:#623a66}.stop-muted{stop-color:#623a66}.tone{fill:#e7c8cd}.s-tone{stroke:#e7c8cd}.stop-tone{stop-color:#e7c8cd}.amber{fill:#e9a256}.s-amber{stroke:#e9a256}.stop-amber{stop-color:#e9a256}.coral{fill:#bd382d}.s-coral{stroke:#bd382d}.stop-coral{stop-color:#bd382d}.iris{fill:#40398e}.s-iris{stroke:#40398e}.stop-iris{stop-color:#40398e}.rule{fill:#a080a0}.s-rule{stroke:#a080a0}.stop-rule{stop-color:#a080a0}.surface{fill:#fff9ef}.s-surface{stroke:#fff9ef}.stop-surface{stop-color:#fff9ef}.rose{fill:#bc7e99}.s-rose{stroke:#bc7e99}.stop-rose{stop-color:#bc7e99}@media(prefers-color-scheme:dark){.paper{fill:#23192f}.s-paper{stroke:#23192f}.stop-paper{stop-color:#23192f}.ink{fill:#fff0e5}.s-ink{stroke:#fff0e5}.stop-ink{stop-color:#fff0e5}.muted{fill:#e8c4dd}.s-muted{stroke:#e8c4dd}.stop-muted{stop-color:#e8c4dd}.tone{fill:#503451}.s-tone{stroke:#503451}.stop-tone{stop-color:#503451}.amber{fill:#ffd087}.s-amber{stroke:#ffd087}.stop-amber{stop-color:#ffd087}.coral{fill:#f77661}.s-coral{stroke:#f77661}.stop-coral{stop-color:#f77661}.iris{fill:#a99bf9}.s-iris{stroke:#a99bf9}.stop-iris{stop-color:#a99bf9}.rule{fill:#775779}.s-rule{stroke:#775779}.stop-rule{stop-color:#775779}.surface{fill:#3a2744}.s-surface{stroke:#3a2744}.stop-surface{stop-color:#3a2744}.rose{fill:#c890ac}.s-rose{stroke:#c890ac}.stop-rose{stop-color:#c890ac}}.depth{fill:#36243e}@media(prefers-color-scheme:dark){.depth{fill:#130e1d}}text{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,serif;letter-spacing:-.055em}.mono{font-family:Consolas,monospace;letter-spacing:.10em}</style>
  <defs>
    <linearGradient id="field" x2="1" y2="1"><stop class="stop-surface"/><stop offset="1" class="stop-tone"/></linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0"><stop class="stop-coral"/><stop offset="1" class="stop-amber"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="1"><stop class="stop-iris"/><stop offset="1" class="stop-rose"/></linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M 0 6 L 6 0" class="s-rule" stroke-width=".65" opacity=".6"/></pattern>
  </defs>
  <rect x="0" y="0" width="600" height="126" rx="13" class="surface"/><path d="M 22 78 H 156 L 204 47 H 395 L 442 78 H 578" fill="none" class="s-rule" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="105" cy="78" r="5" class="coral"/><text x="81" y="63" font-size="18" font-weight="600" class="muted mono">2025</text><text x="90" y="106" font-size="24" font-weight="600" class="ink serif">NCM</text><circle cx="300" cy="47" r="5" class="iris"/><text x="276" y="32" font-size="18" font-weight="600" class="muted mono">2026</text><text x="250" y="75" font-size="24" font-weight="600" class="ink serif">University</text><circle cx="495" cy="78" r="5" class="coral"/><text x="471" y="63" font-size="18" font-weight="600" class="muted mono">2026</text><text x="470" y="106" font-size="24" font-weight="600" class="ink serif">Pathy</text>
