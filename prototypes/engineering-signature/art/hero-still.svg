          <path class="highlight" d="M -24 12 L 0 -2 L 24 12 L 0 26 Z"/><path class="s-ink" fill="none" stroke-width="1.7" d="M -11 12 L 0 6 L 11 12 M -6 17 L 0 14 L 6 17"/>
