  <rect class="bg" width="800" height="132" rx="17"/><ellipse class="highlight" cx="100" cy="47" rx="53" ry="28" transform="rotate(-9 100 47)"/><g transform="translate(78 26)" class="s-ink" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M 6 26 L 25 8 L 44 26 L 25 44 Z M 16 26 H 34"/></g><text x="61" y="114" font-size="32" font-weight="700" class="ink">Build</text><ellipse class="soft" cx="300" cy="47" rx="53" ry="28" transform="rotate(9 300 47)"/><g transform="translate(278 26)" class="s-ink" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M 6 15 H 23 V 34 H 43 M 36 27 L 43 34 L 36 41"/><circle cx="6" cy="15" r="3"/></g><text x="234" y="114" font-size="32" font-weight="700" class="ink">Integrate</text><ellipse class="highlight" cx="500" cy="47" rx="53" ry="28" transform="rotate(-9 500 47)"/><g transform="translate(478 26)" class="s-ink" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 34 H 12 L 19 16 L 27 41 L 34 22 H 45"/></g><text x="439" y="114" font-size="32" font-weight="700" class="ink">Observe</text><ellipse class="soft" cx="700" cy="47" rx="53" ry="28" transform="rotate(9 700 47)"/><g transform="translate(678 26)" class="s-ink" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M 10 41 V 10 H 39 M 28 0 L 39 10 L 28 21"/></g><text x="666" y="114" font-size="32" font-weight="700" class="ink">Ship</text>
